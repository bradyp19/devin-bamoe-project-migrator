################
# Server Config #
################

quarkus.http.port=8080
quarkus.log.level=INFO

################
# Persistence #
################

# Persistence not configured for this simple evaluation process
# For production deployments requiring persistence, add kogito-addons-quarkus-persistence-jdbc
# See: https://raw.githubusercontent.com/IBM/bamoe-docs/9.5.x/upgrade/07-live-data-considerations.adoc
# 
# Example production configuration:
# quarkus.datasource.db-kind=postgresql
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bamoe
# quarkus.datasource.username=bamoe
# quarkus.datasource.password=<password>
# kogito.persistence.type=jdbc
# quarkus.hibernate-orm.database.generation=update

################
# Security #
################

# Non-secured mode for development
# For production, enable OIDC with Keycloak or any compliant IdP
# See: https://raw.githubusercontent.com/IBM/bamoe-docs/9.5.x/upgrade/05-08-upgrading-authentication-authorization.adoc
kogito.security.auth.enabled=false
quarkus.oidc.enabled=false

# In non-secured mode, use query params for task endpoints:
# Example: /usertasks/instance?user=admin&group=Manager

################
# OpenAPI/Swagger #
################

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/q/openapi

################
# Services #
################

kogito.service.url=http://${quarkus.http.host}:${quarkus.http.port}

################
# Dev Services #
################

# Disable all Quarkus Dev Services (Docker/Testcontainers not needed for this simple process)
quarkus.devservices.enabled=false
